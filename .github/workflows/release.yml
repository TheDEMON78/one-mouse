name: Installateurs

# À chaque push sur main : installateurs Windows, macOS et Linux publiés dans
# une release GitHub v1.X.Y (X.Y calculés depuis le nombre de commits).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: echo "version=$(scripts/version.sh)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: nsis,wix
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            formats: dmg
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            formats: dmg
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: deb,appimage
    runs-on: ${{ matrix.os }}
    env:
      # linuxdeploy (AppImage) sans FUSE sur les runners GitHub.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8
      - name: Dépendances Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev libxkbcommon-dev libxi-dev libasound2-dev
      - name: Version ${{ needs.version.outputs.version }}
        shell: bash
        run: scripts/version.sh --apply
      - name: Compilation
        run: cargo build --release --target ${{ matrix.target }}
      - name: Installateurs
        run: cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.formats }}
      - uses: actions/upload-artifact@v4
        with:
          name: one-mouse-${{ needs.version.outputs.version }}-${{ matrix.target }}
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: one-mouse ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
