[package]
name = "one-mouse"
version = "1.0.0"
edition = "2024"
description = "Une seule souris et un seul clavier pour deux PC (Windows, Linux, macOS)"
authors = ["BloopStudio"]
license = "GPL-3.0-or-later"
repository = "https://github.com/TheDEMON78/one-mouse-for-two-pc"

# Installateurs (cargo-packager). La version est injectée par scripts/version.sh.
[package.metadata.packager]
product-name = "one-mouse"
identifier = "com.bloopstudio.onemouse"
publisher = "BloopStudio"
authors = ["BloopStudio"]
copyright = "Copyright © BloopStudio"
description = "Une seule souris et un seul clavier pour deux PC"
long-description = "Partage la souris, le clavier et le presse-papier entre deux PC posés côte à côte, sans partage d'écran."
homepage = "https://github.com/TheDEMON78/one-mouse-for-two-pc"
license-file = "LICENSE"
category = "Utility"
icons = ["assets/icons/32x32.png", "assets/icons/128x128.png", "assets/icons/256x256.png", "assets/icons/512x512.png"]
out-dir = "dist"
binaries = [{ path = "one-mouse", main = true }]

[package.metadata.packager.nsis]
installMode = "currentUser"
installer-icon = "assets/icon.ico"
languages = ["French", "English"]

[package.metadata.packager.deb]
section = "utils"
depends = ["libx11-6", "libxtst6", "libxi6", "libasound2", "libxkbcommon-x11-0", "libgl1"]

[dependencies]
anyhow = "1"
arboard = "3"
argon2 = "0.5"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
env_logger = "0.11"
futures = "0.3"
hkdf = "0.12"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
postcard = { version = "1", features = ["use-std"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time", "sync", "signal"] }

# Les backends Wayland / X11 ne sont activés que pour Linux : le build.rs de ces
# crates détecte l'OS de la machine qui compile, pas celui de la cible.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pulseaudio"] }
input-capture = "0.4.0"
libc = "0.2"
x11 = { version = "2.21", features = ["xlib", "xinput"] }
input-emulation = "0.4.0"
input-event = "0.4.0"

[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.18.2"
input-capture = { version = "0.4.0", default-features = false }
input-emulation = { version = "0.4.0", default-features = false }
input-event = { version = "0.4.0", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
